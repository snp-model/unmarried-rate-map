  <ellipse cx="32" cy="32" rx="15.5" ry="30" transform="rotate(45 32 32)" fill="none" stroke="#f8fafc" stroke-width="1.1" stroke-dasharray="25 160" stroke-dashoffset="78" />

  <g stroke="#f0f2f5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#2166ac" d="m41 16 5 1 3 4-3 3-2 5-5 2-4-3 2-5-1-4z" />
    <path fill="#67a9cf" d="m36 28 7 1 3 4-4 4-3 5-5 2-4-3 2-5 2-4z" />
    <path fill="#fff4d6" d="m30 37 7 1 2 4-5 4-5 2-5-2 1-4z" />
